name: Deploy to Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: netlify-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy (Netlify builds the site and functions)
        run: npx -y @netlify/mcp@latest --site-id "$SITE_ID" --proxy-path "$PROXY_PATH"
        env:
          SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PROXY_PATH: ${{ secrets.NETLIFY_PROXY_PATH }}
